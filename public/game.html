            class="flex size-10 shrink-0 items-center justify-center rounded-full border border-white/70 bg-surface-strong dark:border-border-dark dark:bg-surface-dark-strong">
            <svg
              id="sunIcon"
              class="hidden size-5 cursor-pointer text-textColor-dark"
              aria-label="حالت روشن">
              <use href="#icon-sun"></use>
            </svg>

            <svg
              id="moonIcon"
              class="size-5 cursor-pointer text-textColor"
              aria-label="حالت تاریک">
              <use href="#icon-moon"></use>
            </svg>
          </div>
        </div>
      </header>

      <main
        id="game-main"
        class="relative z-10 page-container py-6 sm:py-8 lg:py-10">
        <section
          class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between"
          aria-labelledby="game-title">
          <div class="flex items-center gap-3.5">
            <div
              id="game-icon-wrap"
              class="flex size-12 shrink-0 items-center justify-center rounded-md bg-primary/10 text-primary dark:bg-primary/15 dark:text-primary-light"
              aria-hidden="true">
              <svg viewBox="0 0 50 50" class="size-6">
                <use id="game-icon-use" href="#icon-game-math"></use>
              </svg>
            </div>

            <div>
              <span
                id="game-eyebrow"
                class="mb-1 block font-Dana-medium text-xs text-mutedColor dark:text-mutedColor-dark">
                مسابقه
              </span>

              <h1 id="game-title" class="!text-[clamp(24px,4vw,34px)]">
                مسابقه
              </h1>
            </div>
          </div>

          <span
            id="game-status"
            class="inline-flex self-start shrink-0 items-center gap-2 rounded-full bg-accent/15 px-3.5 py-2 font-Dana-medium text-xs text-textColor dark:bg-accent/10 dark:text-textColor-dark sm:self-auto">
            آماده
          </span>
        </section>

        <section
          id="game-scorebar"
          class="mb-5 overflow-hidden rounded-md border border-white/70 bg-surface shadow-card backdrop-blur-md dark:border-border-dark dark:bg-surface-dark dark:shadow-card-dark"
          aria-label="وضعیت مسابقه">
          <div id="game-scorebar-grid" class="grid grid-cols-3">
            <!-- Rendered by game.js -->
          </div>
        </section>

        <section
          class="relative min-h-[470px] overflow-hidden rounded-lg border border-white/70 bg-surface px-5 py-10 shadow-floating backdrop-blur-md dark:border-border-dark dark:bg-surface-dark dark:shadow-floating-dark sm:min-h-[520px] sm:px-8 sm:py-12 lg:px-12"
          aria-describedby="game-description">
          <div
            id="game-stage-glow"
            aria-hidden="true"
            class="pointer-events-none absolute -top-24 left-1/2 size-72 -translate-x-1/2 rounded-full bg-primary/10 blur-[100px]"></div>

          <div
            class="relative z-10 flex min-h-[390px] items-center justify-center sm:min-h-[420px]">
            <div id="game-stage-content" class="w-full" aria-live="polite">
              <div class="mx-auto max-w-xl py-10 text-center">
                <span
                  class="font-Dana-regular text-sm text-mutedColor dark:text-mutedColor-dark">
                  در حال آماده‌سازی مسابقه...
                </span>
              </div>
            </div>
          </div>
        </section>

        <div
          class="mt-4 flex flex-col gap-2 px-1 sm:flex-row sm:items-center sm:justify-between">
          <p
            id="game-description"
            class="max-w-2xl !text-xs !leading-6 text-mutedColor dark:text-mutedColor-dark">
            محیط مسابقه دیکته خونه
          </p>

          <span
            class="font-Dana-regular text-xs text-mutedColor dark:text-mutedColor-dark">
            امتیاز کل:
            <strong
              id="game-total-score"
              class="font-Dana-bold text-textColor dark:text-textColor-dark">
              ۰
            </strong>
          </span>
        </div>
      </main>
    </div>

    <!-- Game tutorial -->
    <div
      id="game-tutorial-modal"
      class="fixed inset-0 z-[120] hidden items-center justify-center p-4 sm:p-6"
      aria-hidden="true">
      <div
        id="game-tutorial-backdrop"
        class="absolute inset-0 bg-bg-dark/55 backdrop-blur-sm"
        aria-hidden="true"></div>

      <section
        id="game-tutorial-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="game-tutorial-title"
        aria-describedby="game-tutorial-description"
        class="relative z-10 w-full max-w-lg overflow-hidden rounded-lg border border-white/70 bg-bg shadow-floating dark:border-border-dark dark:bg-bg-dark-secondary dark:shadow-floating-dark">
        <div class="relative overflow-hidden px-5 pt-6 sm:px-6 sm:pt-7">
          <div
            id="game-tutorial-glow"
            aria-hidden="true"
            class="pointer-events-none absolute -top-16 -left-16 size-40 rounded-full bg-primary/10 blur-[70px]"></div>

          <div class="relative z-10">
            <div
              id="game-tutorial-icon-wrap"
              class="mb-5 flex size-12 items-center justify-center rounded-md bg-primary/10 text-primary dark:bg-primary/15 dark:text-primary-light"
              aria-hidden="true">
              <svg viewBox="0 0 50 50" class="size-6">
                <use id="game-tutorial-icon-use" href="#icon-game-math"></use>
              </svg>
            </div>

            <span
              class="mb-2 block font-Dana-medium text-xs text-primary dark:text-primary-light">
              قبل از شروع
            </span>

            <h2 id="game-tutorial-title" class="mb-3 !text-xl sm:!text-2xl">
              روش بازی
            </h2>

            <p
              id="game-tutorial-description"
              class="text-sm leading-8 text-mutedColor dark:text-mutedColor-dark">
              ...
            </p>
          </div>
        </div>

        <div
          id="game-tutorial-steps"
          class="relative z-10 mx-5 mt-5 space-y-2.5 sm:mx-6"></div>

        <div
          class="mt-6 border-t border-textColor/5 px-5 py-4 dark:border-border-dark-soft sm:px-6">
          <button
            id="game-tutorial-confirm"
            type="button"
            class="inline-flex w-full cursor-pointer items-center justify-center rounded-full border border-primary bg-primary px-7 py-3 font-Peyda-medium text-sm text-white shadow-btn transition-all duration-300 hover:-translate-y-0.5 hover:bg-transparent hover:text-primary active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary/30">
            متوجه شدم، شروع کنیم
          </button>
        </div>
      </section>
    </div>

    <!-- Core -->
    <script src="./js/core/themetoggle.js"></script>

    <!-- Components -->
    <script src="./js/components/toast.js"></script>

    <!-- Data -->
    <script src="./js/services/data-provider.js"></script>
    <script src="./js/services/user-service.js"></script>
    <script src="./js/services/folder-service.js"></script>
    <script src="./js/services/word-service.js"></script>

    <!-- Shared game core -->
    <script src="./js/modules/games/game-engine.js"></script>
    <script src="./js/modules/games/game-shell.js"></script>

    <!-- Game modules -->
    <script src="./js/modules/games/dictation-game.js"></script>
    <script src="./js/modules/games/math-game.js"></script>
    <script src="./js/modules/games/science-game.js"></script>

    <!-- Game page controller -->
    <script src="./js/pages/game.js"></script>
  </body>
</html>
